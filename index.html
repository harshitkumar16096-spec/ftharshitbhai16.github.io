<!DOCTYPE html>
<html>
<head>
<title>Login System</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
  margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0a0f2b;
}
.container,.card{
  width:360px;background:white;padding:25px;border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center;
}
input{width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ccc}
button{
  width:100%;padding:12px;margin-top:10px;border:none;border-radius:6px;
  background:linear-gradient(135deg,#667eea,#764ba2);color:white;cursor:pointer;
}
.msg{margin-top:10px;font-size:14px}
a{color:#667eea;cursor:pointer;font-weight:600;text-decoration:none}
.link{
  display:block;padding:12px;margin:10px 0;border-radius:8px;
  background:#f0f0f0;text-decoration:none;color:#333;font-weight:600;
}
.next{margin-top:20px;padding:10px 20px;background:#4CAF50;color:white;border:none;border-radius:8px;display:none}
</style>
</head>

<body>

<!-- REGISTER -->
<div id="registerBox" class="container">
<h2>Create Account</h2>
<input id="rusername" placeholder="Username">
<input type="password" id="rpassword" placeholder="Password">
<button onclick="register()">Register</button>
<div id="rmsg" class="msg"></div>
<p>Already have account? <a onclick="showLogin()">Login</a></p>
</div>

<!-- LOGIN -->
<div id="loginBox" class="container" style="display:none;">
<h2>Login</h2>
<input id="lusername" placeholder="Username">
<input type="password" id="lpassword" placeholder="Password">
<button onclick="login()">Login</button>
<div id="lmsg" class="msg"></div>
<p>New here? <a onclick="showRegister()">Register</a></p>
</div>

<!-- DASHBOARD -->
<div id="dashboardBox" class="card" style="display:none;">
<h2 id="welcomeText">Dashboard</h2>
<p>Please Subscribe All Channels</p>

<a class="link" href="https://youtube.com/@ftharshitbhai16" target="_blank" onclick="countClick(1)">YouTube Channel 1</a>
<a class="link" href="https://youtube.com/@ytytking697" target="_blank" onclick="countClick(2)">YouTube Channel 2</a>
<a class="link" href="https://youtube.com/@dailyshortshub07" target="_blank" onclick="countClick(3)">YouTube Channel 3</a>

<button id="nextBtn" class="next">Next</button>
</div>

<script>
let clicked={1:false,2:false,3:false},clickedCount=0;

function showLogin(){registerBox.style.display="none";loginBox.style.display="block";}
function showRegister(){loginBox.style.display="none";registerBox.style.display="block";}

function register(){
 if(!rusername.value||!rpassword.value){
  rmsg.innerHTML="Fill all fields ❌";rmsg.style.color="red";return;
 }
 localStorage.setItem("user",JSON.stringify({username:rusername.value,password:rpassword.value}));
 rmsg.innerHTML="Registration Successful ✅";rmsg.style.color="green";
}

function login(){
 let data=localStorage.getItem("user");
 if(!data){lmsg.innerHTML="No account ❌";lmsg.style.color="red";return;}
 let user=JSON.parse(data);
 if(lusername.value===user.username&&lpassword.value===user.password){
  loginBox.style.display="none";
  registerBox.style.display="none";
  dashboardBox.style.display="block";
  welcomeText.innerText="Welcome, "+user.username;
 }else{
  lmsg.innerHTML="Wrong details ❌";lmsg.style.color="red";
 }
}

function countClick(id){
 if(!clicked[id]){clicked[id]=true;clickedCount++;}
 if(clickedCount===3){nextBtn.style.display="block";}
}
</script>

</body>
</html>
