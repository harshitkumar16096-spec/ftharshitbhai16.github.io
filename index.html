<!DOCTYPE html>
<html>
<head>
  <title>Welcome | Login & Register</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0f2b;
      overflow: hidden;
    }

    .bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(102,126,234,0.6), rgba(118,75,162,0.6));
      z-index: -2;
    }

    .bg::after {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url("https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=1200&q=80") center/cover no-repeat;
      opacity: 0.5;
      filter: blur(8px);
      z-index: -1;
    }

    .container {
      width: 380px;
      background: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      animation: fadeIn 0.6s ease;
      text-align: center;
      backdrop-filter: blur(6px);
    }

    .welcome { font-size: 26px; font-weight: 600; color: #333; margin-bottom: 5px; }
    h2 { margin-bottom: 20px; color: #666; font-weight: 500; }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    input:focus { outline: none; border-color: #667eea; }

    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    p { font-size: 14px; margin-top: 12px; }
    a { color: #667eea; cursor: pointer; font-weight: 600; text-decoration: none; }
    .msg { margin-top: 10px; font-size: 14px; }

    .card {
      width: 420px;
      background: rgba(255,255,255,0.95);
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
      text-align: center;
    }

    .links {
      margin-top: 20px;
    }

    .link {
      display: block;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      background: #f0f0f0;
      text-decoration: none;
      color: #333;
      font-weight: 600;
    }

    .link:hover {
      background: #e0e0e0;
    }

    .next {
      margin-top: 20px;
      padding: 10px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: none; /* hidden by default */
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

<div class="bg"></div>

<div id="registerBox" class="container">
  <div class="welcome">Welcome</div>
  <h2>Create Account</h2>

  <input id="rusername" placeholder="Username">
  <input id="mobile" placeholder="Mobile Number">
  <input type="password" id="rpassword" placeholder="Password">

  <button onclick="register()">Register</button>
  <div class="msg" id="rmsg"></div>

  <p>Already have an account?
    <a onclick="showLogin()">Login</a>
  </p>
</div>

<div id="loginBox" class="container" style="display:none;">
  <div class="welcome">Welcome</div>
  <h2>Login</h2>

  <input id="lusername" placeholder="Username">
  <input type="password" id="lpassword" placeholder="Password">

  <button onclick="login()">Login</button>
  <div class="msg" id="lmsg"></div>

  <p>New here?
    <a onclick="showRegister()">Register</a>
  </p>
</div>

<div id="dashboardBox" class="card" style="display:none;">
  <h1 id="welcomeText">Dashboard</h1>
  <p>To move ahead, please subscribe & follow</p>

  <div class="links">
    <a id="link1" class="link" href="https://www.youtube.com" target="_blank" onclick="countClick(1)">YouTube Channel 1 - Subscribe</a>
    <a id="link2" class="link" href="https://www.youtube.com" target="_blank" onclick="countClick(2)">YouTube Channel 2 - Subscribe</a>
    <a id="link3" class="link" href="https://www.instagram.com" target="_blank" onclick="countClick(3)">Instagram - Follow</a>
  </div>

  <!-- Next button hidden initially -->
  <button id="nextBtn" class="next" onclick="nextPage()">Next</button>
</div>

<script>
let clickedCount = 0;
let clicked = {1:false,2:false,3:false};

function showLogin() {
  registerBox.style.display = "none";
  loginBox.style.display = "block";
}

function showRegister() {
  loginBox.style.display = "none";
  registerBox.style.display = "block";
}

function register() {
  if (!rusername.value || !rpassword.value || !mobile.value) {
    rmsg.innerHTML = "Please fill all fields ❌";
    rmsg.style.color = "red";
    return;
  }

  localStorage.setItem("user", JSON.stringify({
    username: rusername.value,
    mobile: mobile.value,
    password: rpassword.value
  }));

  rmsg.innerHTML = "Registration Successful ✅";
  rmsg.style.color = "green";
}

function login() {
  var data = localStorage.getItem("user");
  if (!data) {
    lmsg.innerHTML = "No account found ❌";
    lmsg.style.color = "red";
    return;
  }

  var user = JSON.parse(data);

  if (lusername.value === user.username && lpassword.value === user.password) {
    registerBox.style.display = "none";
    loginBox.style.display = "none";
    dashboardBox.style.display = "block";
    welcomeText.innerText = "Welcome, " + user.username;
  } else {
    lmsg.innerHTML = "Invalid login details ❌";
    lmsg.style.color = "red";
  }
}

function countClick(id) {
  if (!clicked[id]) {
    clicked[id] = true;
    clickedCount++;
  }

  // if all 3 clicked then show Next button
  if (clickedCount === 3) {
    nextBtn.style.display = "block";
  }
}

function nextPage() {
  alert("Next page open (you can change this link)");
  // window.location = "next.html"; // uncomment if you create next.html
}
</script>

</body>
  </html>
