<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ft Harshit Bhai Giveaway</title>

<style>
*{box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{margin:0;background:#0a0f2b;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:15px;color:#fff}
.card{width:100%;max-width:420px;background:#fff;color:#000;padding:20px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.3);display:none}
h2{text-align:center;margin-top:0}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ccc;font-size:15px}
button{background:#667eea;color:#fff;border:none;font-weight:700}
.link{display:block;background:#eef2ff;padding:12px;margin:8px 0;border-radius:8px;text-decoration:none;color:#111;font-weight:700;text-align:center}
.preview img{width:70px;margin:5px;border-radius:8px}
.timer{display:flex;justify-content:center;gap:8px;margin-top:12px}
.time-box{background:#111;color:#fff;padding:8px;border-radius:8px;width:65px;text-align:center}
.time-box span{font-size:18px;font-weight:bold;color:#ffd700}
.sparkle{position:fixed;top:-20px;font-size:18px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>

<!-- REGISTER -->
<form id="registerForm" class="card" style="display:block">
<h2>Welcome, Ft Harshit Bhai Giveaway</h2>
<input id="ruser" placeholder="Username" required>
<input type="password" id="rpass" placeholder="Password" required>
<button type="submit">Register</button>
<p onclick="showLogin()" style="text-align:center;color:blue;cursor:pointer">Already have account? Login</p>
</form>

<!-- LOGIN -->
<form id="loginForm" class="card">
<h2>Login</h2>
<input id="luser" placeholder="Username" required>
<input type="password" id="lpass" placeholder="Password" required>
<button type="submit">Login</button>
<p onclick="showRegister()" style="text-align:center;color:blue;cursor:pointer">Create account</p>
</form>

<!-- TASK -->
<div id="taskPage" class="card">
<h2 id="welcomeText"></h2>
<p>Subscribe all 3 channels</p>
<a class="link" href="https://youtube.com/@ftharshitbhai16" target="_blank" onclick="countClick(1)">FT Harshit Bhai</a>
<a class="link" href="https://youtube.com/@ytytking697" target="_blank" onclick="countClick(2)">YTYT King</a>
<a class="link" href="https://youtube.com/@dailyshortshub07" target="_blank" onclick="countClick(3)">Daily Shorts Hub</a>
<button onclick="checkNext()">Next</button>
<p id="taskMsg" style="color:red;text-align:center"></p>
</div>

<!-- UPLOAD -->
<div id="uploadPage" class="card">
<h2>Upload 4 Screenshots</h2>
<input type="file" id="fileInput" accept="image/*">
<div class="preview" id="preview"></div>
<p id="countText">Uploaded: 0 / 4</p>
</div>

<!-- FINAL -->
<div id="finalPage" class="card">
<h2>Wait For Result ⏳</h2>
<h2>CONGRATULATIONS 🎉</h2>
<p id="finalMsg"></p>
<p>Thanks For Participating In Giveaway</p>
<div class="timer">
  <div class="time-box"><span id="days">0</span>DAYS</div>
  <div class="time-box"><span id="hours">0</span>HOURS</div>
  <div class="time-box"><span id="minutes">0</span>MIN</div>
  <div class="time-box"><span id="seconds">0</span>SEC</div>
</div>
</div>

<script>
let clicked={1:false,2:false,3:false},count=0,uploads=[],MAX=4;

// REGISTER
registerForm.onsubmit=e=>{
 e.preventDefault();
 localStorage.setItem("user",JSON.stringify({u:ruser.value.trim(),p:rpass.value.trim()}));
 alert("Registered! Now login.");
 showLogin();
};

// LOGIN
loginForm.onsubmit=e=>{
 e.preventDefault();
 let data=localStorage.getItem("user");
 if(!data){alert("Register first!");return;}
 let user=JSON.parse(data);
 if(luser.value.trim()===user.u && lpass.value.trim()===user.p){
  loginForm.style.display="none";
  taskPage.style.display="block";
  welcomeText.innerText="Welcome "+user.u;
 } else alert("Wrong details");
};

function showLogin(){registerForm.style.display="none";loginForm.style.display="block";}
function showRegister(){loginForm.style.display="none";registerForm.style.display="block";}

function countClick(id){if(!clicked[id]){clicked[id]=true;count++;}}

function checkNext(){
 if(count<3){taskMsg.innerText="Open all 3 channels first!";return;}
 taskPage.style.display="none";uploadPage.style.display="block";
}

fileInput.onchange=e=>{
 let file=e.target.files[0];
 if(!file||uploads.length>=MAX)return;
 let r=new FileReader();
 r.onload=()=>{uploads.push(r.result);preview.innerHTML+=`<img src="${r.result}">`;updateCount()}
 r.readAsDataURL(file);
};

function updateCount(){
 countText.innerText=`Uploaded: ${uploads.length} / 4`;
 if(uploads.length===4){
  uploadPage.style.display="none";finalPage.style.display="block";
  finalMsg.innerHTML="Good luck, <b>"+JSON.parse(localStorage.getItem("user")).u+"</b>!";
  startTimer();startSparkles();
 }
}

// TIMER
const target=new Date("Feb 26, 2026").getTime();
function startTimer(){
 setInterval(()=>{
  let d=target-new Date().getTime();
  days.innerText=Math.floor(d/(1000*60*60*24));
  hours.innerText=Math.floor((d/(1000*60*60))%24);
  minutes.innerText=Math.floor((d/(1000*60))%60);
  seconds.innerText=Math.floor((d/1000)%60);
 },1000);
}

// SPARKLES
function startSparkles(){
 const e=["✨","🎉","⭐","🌟"];
 for(let i=0;i<70;i++){
  let s=document.createElement("div");
  s.className="sparkle";
  s.innerHTML=e[Math.random()*e.length|0];
  s.style.left=Math.random()*100+"vw";
  s.style.animationDuration=(3+Math.random()*4)+"s";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),7000);
 }
}
</script>

</body>
</html>
