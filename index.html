<!DOCTYPE html>
<html>
<head>
<title>Login & Register</title>
<style>
*{box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{
  margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
  background:#0a0f2b;overflow:hidden;
}
.container{
  width:350px;background:white;padding:25px;border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);text-align:center;
}
input{
  width:100%;padding:12px;margin:8px 0;border-radius:6px;border:1px solid #ccc;
}
button{
  width:100%;padding:12px;margin-top:10px;border:none;border-radius:6px;
  background:linear-gradient(135deg,#667eea,#764ba2);color:white;cursor:pointer;
}
.msg{margin-top:10px;font-size:14px}
a{color:#667eea;cursor:pointer;font-weight:600;text-decoration:none}
</style>
</head>

<body>

<div id="registerBox" class="container">
<h2>Create Account</h2>
<input id="rusername" placeholder="Username">
<input type="password" id="rpassword" placeholder="Password">
<button onclick="register()">Register</button>
<div id="rmsg" class="msg"></div>
<p>Already have an account? <a onclick="showLogin()">Login</a></p>
</div>

<div id="loginBox" class="container" style="display:none;">
<h2>Login</h2>
<input id="lusername" placeholder="Username">
<input type="password" id="lpassword" placeholder="Password">
<button onclick="login()">Login</button>
<div id="lmsg" class="msg"></div>
<p>New here? <a onclick="showRegister()">Register</a></p>
</div>

<script>
function showLogin(){
  registerBox.style.display="none";
  loginBox.style.display="block";
}
function showRegister(){
  loginBox.style.display="none";
  registerBox.style.display="block";
}

function register(){
  if(!rusername.value || !rpassword.value){
    rmsg.innerHTML="Please fill all fields ❌";
    rmsg.style.color="red";
    return;
  }

  localStorage.setItem("user", JSON.stringify({
    username:rusername.value,
    password:rpassword.value
  }));

  rmsg.innerHTML="Registration Successful ✅";
  rmsg.style.color="green";
}

function login(){
  let data=localStorage.getItem("user");
  if(!data){
    lmsg.innerHTML="No account found ❌";
    lmsg.style.color="red";
    return;
  }

  let user=JSON.parse(data);
  if(lusername.value===user.username && lpassword.value===user.password){
    lmsg.innerHTML="Login Successful ✅";
    lmsg.style.color="green";
  }else{
    lmsg.innerHTML="Wrong details ❌";
    lmsg.style.color="red";
  }
}
</script>

</body>
</html>
